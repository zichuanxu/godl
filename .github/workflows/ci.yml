name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...

      - run: go test -race ./...

      - run: go build ./cmd/godl

  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l . | grep -v '/node_modules/' || true)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: CLI must not depend on wails
        run: |
          if go list -deps ./cmd/godl | grep -q wails; then
            echo "cmd/godl must not depend on wails"
            exit 1
          fi

      - name: cross-compile CLI
        run: |
          set -e
          targets="darwin/arm64 darwin/amd64 windows/amd64 linux/amd64 linux/arm64"
          for target in $targets; do
            os="${target%/*}"
            arch="${target#*/}"
            out="godl-${os}-${arch}"
            if [ "$os" = "windows" ]; then
              out="${out}.exe"
            fi
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "/tmp/${out}" ./cmd/godl
          done

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: build frontend
        working-directory: app/frontend
        run: npm ci && npm run build

      - name: bindings are up to date
        if: runner.os == 'macOS'
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26
          wails3 generate bindings -clean=true -ts -f '-tags production'
          git diff --exit-code -- frontend/bindings

      - run: go vet -tags production .

      - name: build desktop app
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            CGO_ENABLED=0 go build -tags production -ldflags "-H windowsgui" -o bin/godl.exe .
          else
            go build -tags production -o bin/godl .
          fi

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: sudo apt-get update && sudo apt-get install -y aria2

      - name: performance gate against aria2c
        run: |
          set -o pipefail
          go build -o godl ./cmd/godl
          go build -o bench ./tools/bench
          ./bench -godl ./godl -gate | tee -a "$GITHUB_STEP_SUMMARY"
