name: Install check

# Re-runs the install-to-download check against any release, including a
# draft, with the scripts from the chosen branch.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag, for example v1.0.0
        required: true

# Draft releases are visible only to tokens with write access.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          v="${TAG#v}"
          gh release download "$TAG" -p "godl-desktop_${v}_windows_amd64_setup.exe" -p "godl_${v}_windows_amd64.zip" -D assets
          unzip -o "assets/godl_${v}_windows_amd64.zip" godl.exe -d assets

      - run: app/scripts/smoke-windows.sh assets/godl-desktop_*_setup.exe assets/godl.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          v="${TAG#v}"
          gh release download "$TAG" -p "godl-desktop_${v}_macos_universal.dmg" -p "godl_${v}_darwin_arm64.tar.gz" -D assets
          tar -xzf "assets/godl_${v}_darwin_arm64.tar.gz" -C assets godl

      - run: app/scripts/smoke-macos.sh assets/godl-desktop_*_macos_universal.dmg assets/godl

  # Installs both Scoop packages from zichuanxu/scoop-bucket, as a user would.
  scoop:
    runs-on: windows-latest
    steps:
      - name: install from the bucket
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh -OutFile install.ps1
          .\install.ps1 -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop bucket add zichuanxu https://github.com/zichuanxu/scoop-bucket
          scoop install zichuanxu/godl zichuanxu/godl-desktop
          godl version
          if (-not (Test-Path "$env:USERPROFILE\scoop\apps\godl-desktop\current\godl.exe")) { throw "godl-desktop missing" }
