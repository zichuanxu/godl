version: 2

project_name: godl

builds:
  - id: godl
    main: ./cmd/godl
    binary: godl
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - windows
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: godl
    ids:
      - godl
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  use: git
  sort: asc

release:
  # Published by the release workflow once the desktop packages exist and
  # pass the install-to-download tests, so releases/latest never points at
  # a release without installers.
  draft: true
  prerelease: auto
  footer: |
    ## Install

    | | |
    | --- | --- |
    | macOS app | `godl-desktop_{{ .Version }}_macos_universal.dmg`, or `brew install --cask zichuanxu/tap/godl-desktop` |
    | Windows app | `godl-desktop_{{ .Version }}_windows_amd64_setup.exe`, or `scoop install zichuanxu/godl-desktop` after `scoop bucket add zichuanxu https://github.com/zichuanxu/scoop-bucket` |
    | CLI and service | the `godl_{{ .Version }}_*` archives, `brew install zichuanxu/tap/godl`, or `scoop install zichuanxu/godl` after adding the bucket |

    The builds are not signed. See [docs/install.md](https://github.com/zichuanxu/godl/blob/main/docs/install.md) for the one-time Gatekeeper and SmartScreen steps. Desktop checksums are in `desktop-checksums.txt`.
